<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas - 21 de Septiembre 🌻</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::after,
        *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --dark-color: #030408;
            --yellow-petal: #ffd000;
            --yellow-petal-light: #fff580;
            --yellow-petal-dark: #e69500;
            --stem-color: #17421d;
            --leaf-color: #2e6d36;
        }

        body {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--dark-color);
            overflow: hidden;
            perspective: 1000px;
            font-family: 'Poppins', sans-serif;
            color: #fff;
        }

        /* Fondo nocturno */
        .night {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 20%, #151d38 0%, #030408 100%);
            z-index: 1;
        }

        canvas#starsCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Luna creciente */
        .moon {
            position: fixed;
            top: 6%;
            right: 10%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            box-shadow: -14px 10px 0 2px #ffeb85;
            filter: drop-shadow(0 0 20px rgba(255, 235, 133, 0.8));
            z-index: 3;
            animation: moonSway 6s ease-in-out infinite alternate;
        }

        @keyframes moonSway {
            from {
                transform: translateY(0) rotate(-4deg);
            }

            to {
                transform: translateY(-10px) rotate(4deg);
            }
        }

        /* Pantalla inicial para desbloquear el audio */
        .start-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(12, 19, 36, 0.98), #030408);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-icon {
            font-size: 4.2rem;
            animation: pulseIcon 1.5s infinite ease-in-out alternate;
            margin-bottom: 12px;
        }

        @keyframes pulseIcon {
            from {
                transform: scale(1);
                filter: drop-shadow(0 0 10px #ffd700);
            }

            to {
                transform: scale(1.15);
                filter: drop-shadow(0 0 25px #ffd700);
            }
        }

        .start-title {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            color: #ffeb85;
            margin-bottom: 8px;
        }

        .start-subtitle {
            color: #cbd5e1;
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* Tarjeta superior con dedicatoria */
        .card-wrapper {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 90%;
            max-width: 440px;
            text-align: center;
        }

        .dedication-card {
            background: rgba(13, 20, 36, 0.82);
            border: 1px solid rgba(255, 215, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .tag-date {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #0b0f19;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-to {
            font-family: 'Caveat', cursive;
            font-size: 2.1rem;
            color: #ffe680;
            line-height: 1.1;
            text-shadow: 0 0 12px rgba(255, 230, 128, 0.4);
        }

        .card-msg {
            font-size: 0.88rem;
            color: #e2e8f0;
            line-height: 1.45;
            margin-top: 6px;
            font-weight: 300;
        }

        .card-from {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #ffdf79;
            font-weight: 600;
            font-style: italic;
        }

        /* Botón de control de música */
        .music-toggle-btn {
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.35);
            color: #ffe685;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .music-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.03);
        }

        /* Ramos de flores */
        .garden-container {
            position: relative;
            width: 100vw;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
        }

        .bouquet {
            position: absolute;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transform-origin: bottom center;
        }

        .bouquet--center {
            left: 50%;
            transform: translateX(-50%) scale(1);
            z-index: 10;
        }

        .bouquet--left {
            left: 24%;
            transform: translateX(-50%) scale(0.82) rotate(-6deg);
            z-index: 8;
        }

        .bouquet--right {
            left: 76%;
            transform: translateX(-50%) scale(0.82) rotate(6deg);
            z-index: 8;
        }

        .bouquet--back-left {
            left: 8%;
            transform: translateX(-50%) scale(0.65) rotate(-12deg);
            opacity: 0.85;
            z-index: 6;
        }

        .bouquet--back-right {
            left: 92%;
            transform: translateX(-50%) scale(0.65) rotate(12deg);
            opacity: 0.85;
            z-index: 6;
        }

        .flower {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            z-index: 10;
        }

        .flower--1 {
            animation: moving-flower-1 4s ease-in-out infinite alternate;
        }

        .flower--2 {
            left: 50%;
            transform: rotate(20deg);
            animation: moving-flower-2 4s 0.3s ease-in-out infinite alternate;
        }

        .flower--3 {
            left: 50%;
            transform: rotate(-20deg);
            animation: moving-flower-3 4.2s 0.6s ease-in-out infinite alternate;
        }

        .flower__line {
            height: 55vmin;
            width: 1.5vmin;
            background-image: linear-gradient(to left, #00000030, transparent, #ffffff20), linear-gradient(to top, transparent 10%, var(--stem-color), #276935);
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
            animation: grow-ans 2.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
            border-radius: 4vmin;
        }

        .flower--2 .flower__line {
            height: 45vmin;
        }

        .flower--3 .flower__line {
            height: 42vmin;
        }

        .flower__line__leaf {
            position: absolute;
            width: 7vmin;
            height: 3.5vmin;
            background-image: linear-gradient(to top, rgba(255, 255, 255, 0.1), transparent), radial-gradient(ellipse at top, var(--leaf-color) 40%, #15381a);
            border-radius: 10vmin 0 10vmin 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .flower__line__leaf--1 {
            top: 40%;
            left: 90%;
            transform: rotate(20deg);
        }

        .flower__line__leaf--2 {
            top: 60%;
            right: 90%;
            transform: rotate(-40deg) scaleX(-1);
        }

        .flower__head {
            position: absolute;
            top: -3vmin;
            left: 50%;
            transform: translateX(-50%);
            width: 20vmin;
            height: 20vmin;
        }

        .flower__leafs {
            position: relative;
            width: 100%;
            height: 100%;
            animation: blooming-flower 2.2s backwards;
        }

        .flower__leaf {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4vmin;
            height: 9.5vmin;
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            background: linear-gradient(to top, var(--yellow-petal-dark), var(--yellow-petal), var(--yellow-petal-light));
            transform-origin: bottom center;
            box-shadow: 0 0 1.5vmin rgba(255, 215, 0, 0.4);
        }

        .flower__leaf--1 {
            transform: translate(-50%, 0) rotate(0deg);
        }

        .flower__leaf--2 {
            transform: translate(-50%, 0) rotate(30deg);
        }

        .flower__leaf--3 {
            transform: translate(-50%, 0) rotate(60deg);
        }

        .flower__leaf--4 {
            transform: translate(-50%, 0) rotate(90deg);
        }

        .flower__leaf--5 {
            transform: translate(-50%, 0) rotate(120deg);
        }

        .flower__leaf--6 {
            transform: translate(-50%, 0) rotate(150deg);
        }

        .flower__leaf--7 {
            transform: translate(-50%, 0) rotate(180deg);
        }

        .flower__leaf--8 {
            transform: translate(-50%, 0) rotate(210deg);
        }

        .flower__leaf--9 {
            transform: translate(-50%, 0) rotate(240deg);
        }

        .flower__leaf--10 {
            transform: translate(-50%, 0) rotate(270deg);
        }

        .flower__leaf--11 {
            transform: translate(-50%, 0) rotate(300deg);
        }

        .flower__leaf--12 {
            transform: translate(-50%, 0) rotate(330deg);
        }

        .flower__center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6vmin;
            height: 6vmin;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe066 10%, #d48b00 40%, #543405 85%);
            box-shadow: 0 0 15px rgba(255, 200, 0, 0.7);
            z-index: 10;
        }

        .light {
            position: absolute;
            width: 1.2vmin;
            height: 1.2vmin;
            background-color: #ffe685;
            border-radius: 50%;
            filter: blur(0.2vmin);
            box-shadow: 0 0 10px #ffd700;
            animation: light-float 4s linear infinite;
        }

        @keyframes light-float {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            50% {
                opacity: 0.9;
            }

            100% {
                transform: translateY(-25vmin) scale(1.2);
                opacity: 0;
            }
        }

        @keyframes grow-ans {
            0% {
                height: 0;
            }
        }

        @keyframes blooming-flower {
            0% {
                transform: scale(0);
            }
        }

        @keyframes moving-flower-1 {
            0% {
                transform: rotate(-2deg);
            }

            100% {
                transform: rotate(3deg);
            }
        }

        @keyframes moving-flower-2 {
            0% {
                transform: rotate(18deg);
            }

            100% {
                transform: rotate(24deg);
            }
        }

        @keyframes moving-flower-3 {
            0% {
                transform: rotate(-18deg);
            }

            100% {
                transform: rotate(-24deg);
            }
        }
    </style>
</head>

<body>

    <!-- Archivo de música -->
    <audio id="bgMusic" loop preload="auto">
        <source src="img/Floricienta.mp3" type="audio/mpeg">
    </audio>

    <!-- Pantalla para autorizar y reproducir el sonido en móviles -->
    <div class="start-overlay" id="startOverlay" onclick="startExperience()">
        <div class="start-icon">🌻</div>
        <h2 class="start-title">Un detalle para ti</h2>
        <p class="start-subtitle">Toca la pantalla para abrir tu regalo con música ✨</p>
    </div>

    <div class="night"></div>
    <canvas id="starsCanvas"></canvas>
    <div class="moon"></div>

    <!-- Tarjeta con Mensaje -->
    <div class="card-wrapper">
        <div class="dedication-card">
            <span class="tag-date">21 de Septiembre</span>
            <h1 class="card-to" id="viewPara">Para ti 🌻</h1>
            <p class="card-msg" id="viewMsg">
                Te regalo estas flores amarillas que nunca se marchitan, para recordarte lo brillante, especial y única
                que es tu presencia en mi vida.
            </p>
            <div class="card-from" id="viewDe">Con todo mi cariño ✨</div>
            <button class="music-toggle-btn" id="musicToggleBtn" onclick="toggleMusic()">
                <span id="musicIcon">🎵</span> <span id="musicText">Pausar música</span>
            </button>
        </div>
    </div>

    <!-- Jardín con 5 ramos de flores -->
    <div class="garden-container">
        <div class="bouquet bouquet--back-left" id="bouquetBackLeft"></div>
        <div class="bouquet bouquet--left" id="bouquetLeft"></div>
        <div class="bouquet bouquet--center" id="bouquetCenter"></div>
        <div class="bouquet bouquet--right" id="bouquetRight"></div>
        <div class="bouquet bouquet--back-right" id="bouquetBackRight"></div>
    </div>

    <script>
        // Generador de ramos
        function createBouquetHTML() {
            return `
        <div class="flower flower--1">
          <div class="flower__head">
            <div class="flower__leafs">
              ${Array.from({ length: 12 }, (_, i) => `<div class="flower__leaf flower__leaf--${i + 1}"></div>`).join('')}
              <div class="flower__center"></div>
            </div>
          </div>
          <div class="flower__line">
            <div class="flower__line__leaf flower__line__leaf--1"></div>
            <div class="flower__line__leaf flower__line__leaf--2"></div>
          </div>
        </div>

        <div class="flower flower--2">
          <div class="flower__head">
            <div class="flower__leafs">
              ${Array.from({ length: 12 }, (_, i) => `<div class="flower__leaf flower__leaf--${i + 1}"></div>`).join('')}
              <div class="flower__center"></div>
            </div>
          </div>
          <div class="flower__line">
            <div class="flower__line__leaf flower__line__leaf--1"></div>
            <div class="flower__line__leaf flower__line__leaf--2"></div>
          </div>
        </div>

        <div class="flower flower--3">
          <div class="flower__head">
            <div class="flower__leafs">
              ${Array.from({ length: 12 }, (_, i) => `<div class="flower__leaf flower__leaf--${i + 1}"></div>`).join('')}
              <div class="flower__center"></div>
            </div>
          </div>
          <div class="flower__line">
            <div class="flower__line__leaf flower__line__leaf--1"></div>
            <div class="flower__line__leaf flower__line__leaf--2"></div>
          </div>
        </div>

        <div class="light" style="left: -8vmin; animation-delay: 0.5s;"></div>
        <div class="light" style="left: 8vmin; animation-delay: 1.5s;"></div>
        <div class="light" style="left: 0; animation-delay: 2.5s;"></div>
      `;
        }

        ['bouquetCenter', 'bouquetLeft', 'bouquetRight', 'bouquetBackLeft', 'bouquetBackRight'].forEach(id => {
            document.getElementById(id).innerHTML = createBouquetHTML();
        });

        // Control de música
        const audio = document.getElementById('bgMusic');

        function startExperience() {
            document.getElementById('startOverlay').classList.add('hidden');
            audio.play().then(() => {
                document.getElementById('musicText').innerText = "Pausar música";
            }).catch(err => {
                console.error("Error al reproducir audio:", err);
                document.getElementById('musicText').innerText = "Reanudar música";
            });
        }

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                document.getElementById('musicText').innerText = "Pausar música";
                document.getElementById('musicIcon').innerText = "🎵";
            } else {
                audio.pause();
                document.getElementById('musicText').innerText = "Reanudar música";
                document.getElementById('musicIcon').innerText = "🔇";
            }
        }

        // Estrellas en canvas
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 140; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * (window.innerHeight * 0.75),
                radius: Math.random() * 1.3 + 0.4,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                const opacity = Math.abs(Math.sin(star.alpha));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.85})`;
                ctx.fill();
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // Lectura de parámetros de la URL para personalizar nombres y mensaje
        const params = new URLSearchParams(window.location.search);
        const para = params.get('para');
        const de = params.get('de');
        const msg = params.get('msg');

        if (para) document.getElementById('viewPara').innerText = "Para: " + para + " 🌻";
        if (msg) document.getElementById('viewMsg').innerText = msg;
        if (de) document.getElementById('viewDe').innerText = "Con amor, " + de + " ✨";
    </script>
</body>

</html>
